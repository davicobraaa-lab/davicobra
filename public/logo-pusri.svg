<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <!-- Definitions for filters and paths -->
  <defs>
    <!-- Text path for PALEMBANG -->
    <path id="path-palembang" d="M 85,250 C 80,310 115,370 185,398" fill="none" />
    <!-- Text path for INDONESIA -->
    <path id="path-indonesia" d="M 215,398 C 285,370 320,310 315,250" fill="none" />
    
    <!-- Clip path for outer shield -->
    <clipPath id="shield-clip">
      <path d="M 60,75 L 340,75 L 340,230 C 340,320 280,385 200,410 C 120,385 60,320 60,230 Z" />
    </clipPath>
  </defs>

  <!-- PUSRI TOP LOGOTYPE -->
  <g>
    <!-- Slight 3D bevel / shadow -->
    <text x="202" y="62" text-anchor="middle" fill="#08203e" font-family="'Arial Black', Impact, 'Segoe UI Black', sans-serif" font-weight="900" font-size="54" letter-spacing="3">PUSRI</text>
    <text x="200" y="60" text-anchor="middle" fill="#133d6b" font-family="'Arial Black', Impact, 'Segoe UI Black', sans-serif" font-weight="900" font-size="54" letter-spacing="3">PUSRI</text>
  </g>

  <!-- SHIELD CONTENT (CLIPPED) -->
  <g clip-path="url(#shield-clip)">
    <!-- Base Lower Yellow Area -->
    <rect x="50" y="70" width="300" height="350" fill="#ffe100" />

    <!-- Upper Section Panes (y: 75 to 230) -->
    <!-- Left Pane: Sky Blue -->
    <rect x="50" y="75" width="85" height="155" fill="#009fe3" />
    <!-- Center Pane: Yellow -->
    <rect x="135" y="75" width="130" height="155" fill="#ffe100" />
    <!-- Right Pane: Sky Blue -->
    <rect x="265" y="75" width="85" height="155" fill="#009fe3" />

    <!-- LEFT PANE: Golden Rice Stalk (Tangkai Padi) -->
    <g transform="translate(97, 150) rotate(-12)">
      <!-- Main stalk -->
      <path d="M 0,45 Q -2,10 -12,-35" fill="none" stroke="#e6b800" stroke-width="2.5" stroke-linecap="round" />
      <!-- Rice Grains -->
      <!-- Left side grains -->
      <ellipse cx="-8" cy="30" rx="4" ry="7" transform="rotate(-40 -8 30)" fill="#ffe100" stroke="#b38f00" stroke-width="1" />
      <ellipse cx="-11" cy="15" rx="4" ry="7" transform="rotate(-45 -11 15)" fill="#ffe100" stroke="#b38f00" stroke-width="1" />
      <ellipse cx="-14" cy="0" rx="4" ry="7" transform="rotate(-50 -14 0)" fill="#ffe100" stroke="#b38f00" stroke-width="1" />
      <ellipse cx="-16" cy="-15" rx="3.5" ry="6.5" transform="rotate(-55 -16 -15)" fill="#ffe100" stroke="#b38f00" stroke-width="1" />
      <ellipse cx="-16" cy="-28" rx="3" ry="5.5" transform="rotate(-60 -16 -28)" fill="#ffe100" stroke="#b38f00" stroke-width="1" />
      
      <!-- Right side grains -->
      <ellipse cx="-1" cy="24" rx="4" ry="7" transform="rotate(25 -1 24)" fill="#ffe100" stroke="#b38f00" stroke-width="1" />
      <ellipse cx="-4" cy="9" rx="4" ry="7" transform="rotate(20 -4 9)" fill="#ffe100" stroke="#b38f00" stroke-width="1" />
      <ellipse cx="-7" cy="-6" rx="4" ry="7" transform="rotate(15 -7 -6)" fill="#ffe100" stroke="#b38f00" stroke-width="1" />
      <ellipse cx="-10" cy="-21" rx="3.5" ry="6.5" transform="rotate(10 -10 -21)" fill="#ffe100" stroke="#b38f00" stroke-width="1" />
      <!-- Top grain -->
      <ellipse cx="-13" cy="-36" rx="3" ry="5.5" transform="rotate(-15 -13 -36)" fill="#ffe100" stroke="#b38f00" stroke-width="1" />
    </g>

    <!-- CENTER PANE: Cargo Ship with Urea Sacks on Waves -->
    <g transform="translate(200, 150)">
      <!-- Ship Hull (Kapal Kargo) -->
      <path d="M -50,-10 L 48,-10 Q 56,-10 60,-17 L -36,-17 L -50,-10 Z" fill="#0f68a9" />
      <!-- Bridge / Cabin at Stern -->
      <polygon points="-46,-17 -46,-24 -36,-24 -36,-17" fill="#0f68a9" />
      
      <!-- Cargo: Stacks of Urea fertilizer bags on deck -->
      <g fill="#ffe100" stroke="#0f68a9" stroke-width="1.8">
        <!-- Row 1 (Lower) -->
        <rect x="-32" y="-24" width="7" height="6" />
        <rect x="-24" y="-24" width="7" height="6" />
        <rect x="-16" y="-24" width="7" height="6" />
        <rect x="-8" y="-24" width="7" height="6" />
        <rect x="0" y="-24" width="7" height="6" />
        <rect x="8" y="-24" width="7" height="6" />
        <rect x="16" y="-24" width="7" height="6" />
        <rect x="24" y="-24" width="7" height="6" />
        <rect x="32" y="-24" width="7" height="6" />
        <rect x="40" y="-24" width="7" height="6" />
        
        <!-- Row 2 (Middle) -->
        <rect x="-28" y="-31" width="7" height="6" />
        <rect x="-20" y="-31" width="7" height="6" />
        <rect x="-12" y="-31" width="7" height="6" />
        <rect x="-4" y="-31" width="7" height="6" />
        <rect x="4" y="-31" width="7" height="6" />
        <rect x="12" y="-31" width="7" height="6" />
        <rect x="20" y="-31" width="7" height="6" />
        <rect x="28" y="-31" width="7" height="6" />
        <rect x="36" y="-31" width="7" height="6" />

        <!-- Row 3 (Top) -->
        <rect x="-24" y="-37" width="7" height="5" />
        <rect x="-16" y="-37" width="7" height="5" />
        <rect x="-8" y="-37" width="7" height="5" />
        <rect x="0" y="-37" width="7" height="5" />
        <rect x="8" y="-37" width="7" height="5" />
        <rect x="16" y="-37" width="7" height="5" />
        <rect x="24" y="-37" width="7" height="5" />
        <rect x="32" y="-37" width="7" height="5" />
      </g>

      <!-- 3 Water Waves beneath Ship -->
      <path d="M -48,-4 Q -35,-8 -20,-4 Q -5,0 10,-4 Q 25,-8 40,-4 Q 50,0 58,-4" fill="none" stroke="#0f68a9" stroke-width="3" stroke-linecap="round" />
      <path d="M -44,4 Q -32,0 -18,4 Q -3,8 12,4 Q 27,0 42,4 Q 50,7 56,4" fill="none" stroke="#0f68a9" stroke-width="2.5" stroke-linecap="round" />
      <path d="M -40,12 Q -28,8 -14,12 Q 0,16 15,12 Q 30,8 44,12 Q 49,14 54,12" fill="none" stroke="#0f68a9" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- RIGHT PANE: 5 Cotton Capsules (Untaian Kapas) -->
    <g transform="translate(303, 110)">
      <!-- 5 Cotton bolls stacked vertically -->
      <!-- Boll 1 (top) -->
      <g transform="translate(0, 0)">
        <polygon points="-8,10 0,2 8,10 0,6" fill="#ffe100" stroke="#b38f00" stroke-width="0.8" />
        <circle cx="0" cy="0" r="7.5" fill="#ffffff" stroke="#d4af37" stroke-width="1.2" />
        <circle cx="0" cy="0" r="3.5" fill="#fff9db" />
      </g>
      <!-- Boll 2 -->
      <g transform="translate(0, 22)">
        <polygon points="-8,10 0,2 8,10 0,6" fill="#ffe100" stroke="#b38f00" stroke-width="0.8" />
        <circle cx="0" cy="0" r="7.5" fill="#ffffff" stroke="#d4af37" stroke-width="1.2" />
        <circle cx="0" cy="0" r="3.5" fill="#fff9db" />
      </g>
      <!-- Boll 3 -->
      <g transform="translate(0, 44)">
        <polygon points="-8,10 0,2 8,10 0,6" fill="#ffe100" stroke="#b38f00" stroke-width="0.8" />
        <circle cx="0" cy="0" r="7.5" fill="#ffffff" stroke="#d4af37" stroke-width="1.2" />
        <circle cx="0" cy="0" r="3.5" fill="#fff9db" />
      </g>
      <!-- Boll 4 -->
      <g transform="translate(0, 66)">
        <polygon points="-8,10 0,2 8,10 0,6" fill="#ffe100" stroke="#b38f00" stroke-width="0.8" />
        <circle cx="0" cy="0" r="7.5" fill="#ffffff" stroke="#d4af37" stroke-width="1.2" />
        <circle cx="0" cy="0" r="3.5" fill="#fff9db" />
      </g>
      <!-- Boll 5 (bottom) -->
      <g transform="translate(0, 88)">
        <polygon points="-8,10 0,2 8,10 0,6" fill="#ffe100" stroke="#b38f00" stroke-width="0.8" />
        <circle cx="0" cy="0" r="7.5" fill="#ffffff" stroke="#d4af37" stroke-width="1.2" />
        <circle cx="0" cy="0" r="3.5" fill="#fff9db" />
        <path d="M 0,8 Q 5,16 12,18" fill="none" stroke="#ffe100" stroke-width="2" />
      </g>
    </g>

    <!-- LOWER-CENTER INNER SHIELD: Pupuk Urea & Granules -->
    <!-- Inner Blue Shield Path -->
    <path d="M 135,230 L 265,230 L 265,300 C 265,350 215,350 200,350 C 185,350 135,350 135,300 Z" fill="#0086d6" stroke="#111827" stroke-width="3" />

    <!-- PUPUK UREA Text -->
    <text x="200" y="268" text-anchor="middle" fill="#ffe100" font-family="'Arial Black', Impact, 'Segoe UI Black', sans-serif" font-weight="900" font-size="21" letter-spacing="1">PUPUK</text>
    <text x="200" y="293" text-anchor="middle" fill="#ffe100" font-family="'Arial Black', Impact, 'Segoe UI Black', sans-serif" font-weight="900" font-size="21" letter-spacing="1">UREA</text>

    <!-- Fertilizer Prills / White Granules Rosette (8 dots) -->
    <g fill="#ffffff" stroke="#0f68a9" stroke-width="0.8">
      <!-- Ring of 7 granules around 1 center granule -->
      <circle cx="200" cy="308" r="3.5" />
      <circle cx="193" cy="314" r="3.5" />
      <circle cx="207" cy="314" r="3.5" />
      <circle cx="188" cy="323" r="3.5" />
      <circle cx="200" cy="323" r="3.5" />
      <circle cx="212" cy="323" r="3.5" />
      <circle cx="193" cy="332" r="3.5" />
      <circle cx="207" cy="332" r="3.5" />
      <circle cx="200" cy="340" r="3.5" />
    </g>

    <!-- PALEMBANG INDONESIA TEXT ON LOWER YELLOW BORDER -->
    <g fill="#0f68a9" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="20" letter-spacing="2">
      <!-- Curved PALEMBANG along left shield edge -->
      <text fill="#0f68a9">
        <textPath href="#path-palembang" startOffset="5%" text-anchor="start">
          PALEMBANG
        </textPath>
      </text>

      <!-- Curved INDONESIA along right shield edge -->
      <text fill="#0f68a9">
        <textPath href="#path-indonesia" startOffset="95%" text-anchor="end">
          INDONESIA
        </textPath>
      </text>
    </g>

    <!-- Bottom Emblem Icon / Lotus Flame -->
    <g transform="translate(200, 385) scale(0.9)" stroke="#0f68a9" stroke-width="2" fill="none">
      <path d="M 0,16 L -6,4 Q -8,-4 0,-12 Q 8,-4 6,4 Z" />
      <path d="M 0,16 L -10,8 Q -14,0 -6,-6" />
      <path d="M 0,16 L 10,8 Q 14,0 6,-6" />
    </g>

    <!-- DIVISION LINES (BLACK BORDERS) -->
    <!-- Vertical line between Left and Center Pane -->
    <line x1="135" y1="75" x2="135" y2="230" stroke="#111827" stroke-width="3" />
    <!-- Vertical line between Center and Right Pane -->
    <line x1="265" y1="75" x2="265" y2="230" stroke="#111827" stroke-width="3" />
    <!-- Horizontal Divider Line across entire shield -->
    <line x1="60" y1="230" x2="340" y2="230" stroke="#111827" stroke-width="3.5" />
  </g>

  <!-- OUTER SHIELD BLACK BORDER -->
  <path d="M 60,75 L 340,75 L 340,230 C 340,320 280,385 200,410 C 120,385 60,320 60,230 Z" fill="none" stroke="#111827" stroke-width="4" stroke-linejoin="round" />
</svg>
